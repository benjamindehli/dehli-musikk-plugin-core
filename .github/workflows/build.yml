name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads the repository and checks it. Nothing here writes anything.
permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it. Pushes
# to main are left to finish, so each one keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # Every platform a plugin built on this library ships for, with warnings
    # as errors, since that is the default when the library is built on its
    # own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  gui:
    name: GUI module, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # The GUI module is compiled by the plugins that use it, so it is built
    # here with JUCE, as a plugin would build it, and its test paints every
    # control with no window and no display.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The headers JUCE's graphics need on Linux. Short apt timeouts and a
      # few retries, since the runners' mirror stops answering now and then.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi

            echo "apt-get update failed on attempt $attempt, retrying"
            sleep 10
          done

          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libgl-dev libxi-dev libegl-dev

      - name: Configure
        run: >
          cmake -B build-gui
          -DCMAKE_BUILD_TYPE=Release
          -DDM_PLUGIN_CORE_GUI_TESTS=ON

      - name: Build
        run: cmake --build build-gui --config Release --parallel 2 --target dm_gui_test

      - name: Test
        run: ctest --test-dir build-gui --build-config Release --output-on-failure -R gui

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The tests again, built with the address and undefined behaviour
    # sanitizers, which stop at a read past an array or a value the standard
    # does not define, where a plain build would carry on with a plausible
    # number.
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDM_PLUGIN_CORE_SANITIZE=ON

      - name: Build
        run: cmake --build build-san --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Prettier for the docs, the readme and the workflows, and clang-format for
    # the C++. Both versions are pinned, so this job and a developer format
    # alike.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run format:check

      - run: pip install clang-format==23.1.1

      - name: The C++ is formatted
        run: >
          find include src tests modules -name '*.h' -o -name '*.cpp'
          | xargs clang-format --style=LLVM --dry-run -Werror
